spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:mysql://localhost:3306/payment_db?createDatabaseIfNotExist=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

server:
  port: 8083

# Stripe configuration - set these via environment variables using your own
# test keys from https://dashboard.stripe.com/test/apikeys. Do not commit
# real keys here.
stripe:
  publishable-key: ${STRIPE_PUBLISHABLE_KEY:REPLACE_WITH_YOUR_STRIPE_PUBLISHABLE_KEY}
  secret-key: ${STRIPE_SECRET_KEY:REPLACE_WITH_YOUR_STRIPE_SECRET_KEY}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:REPLACE_WITH_YOUR_STRIPE_WEBHOOK_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health,info
